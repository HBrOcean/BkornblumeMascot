name: Release

# 打 tag 即发版：git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Publish (single file, self-contained)
      run: >
        dotnet publish -c Release -r ${{ matrix.rid }} --self-contained
        -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
        -o out

    - name: Package (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: Compress-Archive -Path out/* -DestinationPath BkornblumeMascot-${{ matrix.rid }}.zip

    - name: Package (macOS / Linux)
      if: runner.os != 'Windows'
      run: tar -czf BkornblumeMascot-${{ matrix.rid }}.tar.gz -C out .

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: BkornblumeMascot-${{ matrix.rid }}
        path: |
          BkornblumeMascot-${{ matrix.rid }}.zip
          BkornblumeMascot-${{ matrix.rid }}.tar.gz
        if-no-files-found: ignore

  release:

    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: artifacts/**/*
        generate_release_notes: true
