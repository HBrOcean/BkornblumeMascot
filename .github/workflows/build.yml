name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore
      run: dotnet restore

    - name: Build
      run: dotnet build -c Release --no-restore

    # 冒烟测试：不开窗口，直接渲染一帧 Spine，确认三套模型的 atlas/skel/png 都能加载
    - name: Render smoke test (302001)
      continue-on-error: true
      run: dotnet run -c Release --no-build -- --dump 302001

    - name: Render smoke test (302002)
      continue-on-error: true
      run: dotnet run -c Release --no-build -- --dump 302002

    - name: Render smoke test (302003)
      continue-on-error: true
      run: dotnet run -c Release --no-build -- --dump 302003
